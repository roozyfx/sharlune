name: Multi-platform CMake Build (Linux(gcc/clang), macOS, Windows)

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_EPOCH: "1"

jobs:
  build:
    name: ${{ matrix.config.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - name: Linux GCC 15
            os: ubuntu-26.04
            preset: linux-gcc15
            cc: gcc-15
            cxx: g++-15
          - name: Linux Clang 21
            os: ubuntu-26.04
            preset: linux-clang21
            cc: clang-21
            cxx: clang++-21
          - name: macOS AppleClang 21
            os: macos-26
            preset: macos-clang
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2025
            preset: windows-msvc
            cc: cl
            cxx: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # Linux
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            g++-15 pkg-config ninja-build \
            libopenexr-dev libimath-dev

      # due to C++23 features, we need clang-21. Clang-22 is also available, but 21 is enough for now
      - name: Install Clang 21 (Linux)
        if: matrix.config.preset == 'linux-clang21'
        run: |
          sudo apt install -y --no-install-recommends clang-21

      # macOS
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openexr imath
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      # Windows
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg binary packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-openexr-${{ env.CACHE_EPOCH }}

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg\vcpkg.exe" install openexr:x64-windows
          "VCPKG_ROOT=$($vcpkg -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      #############################################
      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          if [ "${{ runner.os }}" = "Windows" ]; then cl; else ${{ matrix.config.cxx }} --version; fi

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.config.preset }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.config.preset }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.config.preset }}-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}